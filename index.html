<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完全ローカル・APIなし！ブラウザAI画像生成</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --card-bg: #1e1e1e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: var(--accent-color);
            font-size: 24px;
            margin-bottom: 10px;
        }
        p.description {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: var(--text-color);
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        button {
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            color: #121212;
            background-color: var(--accent-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }
        button:hover {
            background-color: #9a67ea;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
        }
        .status-container {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
            text-align: left;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            display: none; /* 初期は非表示 */
        }
        .status-item {
            margin-bottom: 5px;
        }
        #progress-bar-container {
            width: 100%;
            background-color: #444;
            border-radius: 4px;
            height: 8px;
            margin-top: 10px;
            display: none;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 4px;
            transition: width 0.1s;
        }
        .result-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 256px;
        }
        #outputImage {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none; /* 生成されるまで非表示 */
        }
        .loader {
            display: none;
            border: 4px solid #333;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WebGPU ローカル画像生成 (APIなし)</h1>
    <p class="description">
        外部APIを使わず、あなたのブラウザ(WebGPU)でAIモデルを動かして画像を生成します。<br>
        <strong>※初回はモデルのダウンロード(数GB)に時間がかかります。Chrome推奨。</strong>
    </p>

    <div class="input-group">
        <textarea id="promptInput" placeholder="英語でプロンプトを入力 (例: A beautiful landscape of a futuristic city at sunset, cinematic lighting)"></textarea>
        <button id="generateBtn">画像を生成 (ローカル)</button>
    </div>

    <!-- ステータスとプログレスバー -->
    <div class="status-container" id="statusContainer">
        <div id="statusText">準備中...</div>
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <div class="result-container">
        <div class="loader" id="loader"></div>
        <img id="outputImage" src="" alt="AI生成画像">
    </div>
</div>

<script type="module">
    // Hugging FaceのTransformers.jsライブラリをCDNから読み込む
    // WebGPUに対応した最新版(v3)を使用
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0-alpha.13/dist/transformers.js';

    const promptInput = document.getElementById('promptInput');
    const generateBtn = document.getElementById('generateBtn');
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const progressBarContainer = document.getElementById('progress-bar-container');
    const progressBar = document.getElementById('progress-bar');
    const loader = document.getElementById('loader');
    const outputImage = document.getElementById('outputImage');

    let generator = null; // AIパイプラインを保持

    // ページ読み込み時にWebGPUのサポートを確認
    async function checkWebGPU() {
        if (!navigator.gpu) {
            statusContainer.style.display = 'block';
            statusText.innerHTML = '<b style="color: #e74c3c;">エラー: あなたのブラウザはWebGPUに対応していません。</b><br>最新版のGoogle Chromeを使い、高性能なGPUを搭載したPCで実行してください。';
            generateBtn.disabled = true;
            return false;
        }
        return true;
    }

    // AIモデルをロードする関数（最初の1回だけ実行）
    async function loadModel() {
        if (generator) return true;

        statusContainer.style.display = 'block';
        statusText.textContent = 'AIモデルを初期化中... (初回は数GBのダウンロードが発生します)';
        generateBtn.disabled = true;

        try {
            // パイプライン（AIモデル）の作成
            // モデル名: 'xenova/stable-diffusion-v1-5' (ブラウザ向けに量子化された軽量版)
            // device: 'webgpu' を指定してGPUを使用
            generator = await pipeline('image-to-image', 'xenova/stable-diffusion-v1-5', {
                device: 'webgpu',
                // モデルのダウンロード進捗を監視
                progress_callback: (p) => {
                    if (p.status === 'downloading') {
                        progressBarContainer.style.display = 'block';
                        statusText.textContent = `モデルをダウンロード中: ${p.file} (${Math.round(p.loaded)} / ${Math.round(p.total)} bytes)`;
                        progressBar.style.width = `${p.progress * 100}%`;
                    } else if (p.status === 'ready') {
                        statusText.textContent = 'モデルの準備が完了しました！';
                        progressBarContainer.style.display = 'none';
                    }
                }
            });
            return true;
        } catch (error) {
            statusText.innerHTML = `<b style="color: #e74c3c;">モデルのロードに失敗しました:</b> ${error.message}`;
            generateBtn.disabled = false;
            return false;
        }
    }

    // 画像生成を実行する関数
    async function generateImage() {
        const prompt = promptInput.value.trim();
        if (!prompt) {
            alert('プロンプトを入力してください。');
            return;
        }

        const webgpuOk = await checkWebGPU();
        if (!webgpuOk) return;

        const modelOk = await loadModel();
        if (!modelOk) return;

        // UIの状態を「生成中」にする
        outputImage.style.display = 'none';
        loader.style.display = 'block';
        statusContainer.style.display = 'block';
        statusText.textContent = '画像を生成中... (これには数十秒〜数分かかる場合があります)';
        generateBtn.disabled = true;
        generateBtn.textContent = '生成中...';

        // GPUの処理時間を確保するために少し待つ
        await new Promise(r => setTimeout(r, 100));

        try {
            // 画像生成の実行
            // Stable Diffusion v1.5 (image-to-imageだが、ダミー画像を入れてtext-to-imageとして使う例)
            
            // Text-to-Imageのパイプラインがv3でまだ不安定な場合があるため、
            // 簡略化のために、本来はtext-to-imageのモデルを使うべきですが、
            // transformers.jsのv3のドキュメントに沿った形で実装します。
            
            // 注意: transformers.js v3のimage-to-imageパイプラインを
            // text-to-imageとして動かすためのヘルパー
            const startTime = performance.now();
            
            // 最も単純なtext-to-imageの呼び出し方 (transformers.js v3)
            const result = await generator(prompt, {
                num_inference_steps: 20, // ステップ数（多いほど高品質だが遅い。ローカルなので少なめに）
                guidance_scale: 7.5,
                width: 256, // ローカルなのでサイズは小さく(256x256)
                height: 256,
            });

            const endTime = performance.now();
            const duration = ((endTime - startTime) / 1000).toFixed(1);

            // 生成された画像を表示
            const imageBlob = result[0];
            const imageUrl = URL.createObjectURL(imageBlob);
            outputImage.src = imageUrl;
            outputImage.style.display = 'block';
            statusText.textContent = `生成完了！ (${duration} 秒)`;

        } catch (error) {
            statusText.innerHTML = `<b style="color: #e74c3c;">生成エラー:</b> ${error.message}`;
        } finally {
            // UIの状態を元に戻す
            loader.style.display = 'none';
            generateBtn.disabled = false;
            generateBtn.textContent = '画像を生成 (ローカル)';
        }
    }

    // イベントリスナーの登録
    generateBtn.addEventListener('click', generateImage);

    // 起動時にWebGPUチェックだけしておく
    checkWebGPU();

</script>

</body>
</html>
